name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Install HTTP boundary test dependencies
        run: pip install -c requirements.lock fastapi httpx

      - name: Run offline behavior tests
        run: python -m unittest discover -s tests -v

  homebridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: homebridge/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: homebridge
      - run: npm test
        working-directory: homebridge
