name: CI

on:
  push:
    branches: [main, v2]   # v2: the rebuild branch (docs/refactor-plan.md); remove when it is merged
  pull_request:

jobs:
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install matching real HA test framework
        run: pip install "homeassistant==2026.10.1" pytest-homeassistant-custom-component "switchbot-api==2.13.0"
      - name: Test registry, flows and lifecycle without home hardware
        run: pytest -q
        working-directory: homeassistant

  syntax:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Install HTTP boundary test dependencies
        run: pip install -c requirements.lock fastapi httpx uvicorn websockets SQLAlchemy

      - name: Run offline behavior tests
        run: python -m unittest discover -s tests -v

  homebutler:
    # The rebuilt service (homebutler/, docs/refactor-plan.md): SQLite here, PostgreSQL in the next job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Run the rebuilt service's tests
        run: python -m homebutler.tests.run

  postgres:
    # The optional database copy (history_store.py) on real PostgreSQL; the other tests use SQLite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install database dependencies
        run: pip install -r requirements.lock
      - name: Run store tests against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/postgres
        run: python -m unittest tests.test_history_store tests.test_db_backup -v
      - name: Run the rebuilt service's tests against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/postgres
        run: python -m homebutler.tests.run

  homebridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: homebridge/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: homebridge
      - run: npm test
        working-directory: homebridge

  macos-telemetry:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test daemon lifecycle with fake operating-system calls
        run: python -m unittest discover -s tests -p test_macos_daemon.py -v
      - name: Compile and run native fake tests (no Keychain or network)
        run: >-
          python agent/macos_daemon/build.py
          --config agent/macos_daemon/config.example.json
          --output "$RUNNER_TEMP/telemetry-fake-tests" --tests-only
      - name: Test automatic-update sender policy and compile local signer (no Keychain or network)
        run: >-
          python agent/macos_daemon/auto_update/check_native.py
          --output "$RUNNER_TEMP/telemetry-update-fake-tests"
