name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install matching real HA test framework
        run: pip install "homeassistant==2026.10.4" pytest-homeassistant-custom-component "switchbot-api==2.13.0"
      - name: Test registry, flows and lifecycle without home hardware
        run: pytest -q
        working-directory: homeassistant

  syntax:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Test the computer agents (Mac metrics service, with fakes)
        run: python -m unittest discover -s agent/tests -v

  homebutler:
    # The rebuilt service (homebutler/, docs/refactor-plan.md): SQLite here, PostgreSQL in the next job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Run the rebuilt service's tests
        run: python -m homebutler.tests.run

  postgres:
    # The service's tests again on real PostgreSQL (Supabase in production); the job above uses SQLite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install database dependencies
        run: pip install -r requirements.lock
      - name: Run the rebuilt service's tests against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/postgres
        run: python -m homebutler.tests.run

  homebridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: homebridge/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: homebridge
      - run: npm test
        working-directory: homebridge
