name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install matching real HA test framework
        run: pip install "homeassistant==2026.9.2" pytest-homeassistant-custom-component "switchbot-api==2.13.0"
      - name: Test registry, flows and lifecycle without home hardware
        run: pytest -q
        working-directory: homeassistant

  syntax:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Install HTTP boundary test dependencies
        run: pip install -c requirements.lock fastapi httpx

      - name: Run offline behavior tests
        run: python -m unittest discover -s tests -v

  homebridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: homebridge/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: homebridge
      - run: npm test
        working-directory: homebridge

  macos-telemetry:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test daemon lifecycle with fake operating-system calls
        run: python -m unittest discover -s tests -p test_macos_daemon.py -v
      - name: Compile and run native fake tests (no Keychain or network)
        run: >-
          python agent/macos_daemon/build.py
          --config agent/macos_daemon/config.example.json
          --output "$RUNNER_TEMP/telemetry-fake-tests" --tests-only
